include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A premium feel dies by a thousand jank frames. These are the cheap wins the
    # analyzer can enforce, so they are ERRORS, not suggestions.
    prefer_const_constructors: error
    prefer_const_literals_to_create_immutables: error
    prefer_const_declarations: error
    # Deprecated APIs we must not drift back onto (MaterialStateProperty,
    # onPopInvoked, cacheExtent, Theme classes renamed to *ThemeData).
    deprecated_member_use: error
    deprecated_member_use_from_same_package: error
    # Freezed's @JsonSerializable-on-factory pattern (ported models) trips this
    # by design — same suppression as the reference app.
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/app/l10n/app_localizations*.dart"
    # comment-guard writes transient Dart snapshots here while it verifies a cull.
    - "tools/comment-guard/out/**"

linter:
  rules:
    - always_declare_return_types
    - avoid_returning_this
    - avoid_setters_without_getters
    - avoid_types_on_closure_parameters
    - avoid_void_async
    - cancel_subscriptions
    - directives_ordering
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - no_literal_bool_comparisons
    - no_self_assignments
    - omit_local_variable_types
    - prefer_final_in_for_each
    - prefer_final_locals
    - prefer_null_aware_method_calls
    - prefer_relative_imports
    - prefer_single_quotes
    - sized_box_shrink_expand
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_breaks
    - unnecessary_lambdas
    - unnecessary_library_directive
    - unnecessary_parenthesis
    - unnecessary_raw_strings
    - unnecessary_statements
    - use_colored_box
    - use_decorated_box
    - use_string_buffers
