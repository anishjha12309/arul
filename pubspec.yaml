# Arul. Android-only — no iOS/web/desktop targets exist and none should be added.
# Before bumping ANY package, fetch its pub.dev docs (CLAUDE.md §3).
#
# DELIBERATELY ABSENT (bloat/perf, decided 2026-07-14 — do not "helpfully" re-add):
#   google_fonts       — fetches fonts over HTTP at first launch (wrong font on frame
#                        one, broken offline, a gstatic privacy disclosure). The system
#                        stack already covers Latin + all 5 Indic scripts at zero bytes.
#   font_awesome_flutter — ships whole icon fonts; built-in `Icons` tree-shakes to only
#                        the glyphs referenced. Never build IconData() at runtime.
#   shimmer            — uses ShaderMask => saveLayer() (an offscreen pass PER FRAME).
#                        lib/app/widgets/skeleton.dart animates a gradient instead.
name: arul
description: "Arul — South Indian wallpapers"
publish_to: 'none'
version: 1.0.0+61

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^3.3.2      # state; the only cross-layer glue
  go_router: ^17.3.0            # nav
  cached_network_image: ^3.4.1  # static wallpapers (decoded at display size)
  shared_preferences: ^2.5.5    # theme mode, locale
  http: ^1.2.0                  # CDN catalog fetches
  connectivity_plus: ^7.2.0     # offline gate — transport-level online/offline
  url_launcher: ^6.3.2          # support mail, share sheet, links OUT of the
                                # in-app policy reader (mailto:, PhonePe, Google)
  webview_flutter: ^4.14.1      # the in-app Privacy/Terms reader. Policy pages
                                # must open INSIDE the app, never in the browser
                                # (reviewer, 2026-08-12) — see policy_screen.dart
  package_info_plus: ^10.2.0    # version row in Settings

  # ── Live wallpapers + apply (ported with the native Media3 pipeline).
  path_provider: ^2.1.5         # app-internal dirs for the applied live video
  flutter_cache_manager: ^3.4.1 # disk cache for prefetched MP4s (shared w/ CNI)
  share_plus: ^13.2.0           # share a wallpaper file
  just_audio: ^0.10.6           # ringtone preview — ONE shared AudioPlayer
                                # (ringtone_preview_provider), streamed from CDN
  image: ^4.9.1                 # JPEG encode for the share watermark (in Isolate.run)

  # ── Local notifications (devotional reminders). Fully on-device: no FCM, no
  # network, no server. Versions pinned to Pakiza's, which ships the same stack.
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.0             # tz-correct zonedSchedule (wall-clock local times)
  flutter_timezone: ^5.1.0      # device IANA timezone → tz.setLocalLocation

  # ── Phase 4 logic port (versions pinned to the reference app's pubspec).
  riverpod_annotation: ^4.0.3   # codegen'd providers (auth/analytics/premium/…)
  freezed_annotation: ^3.1.0    # models
  json_annotation: ^4.12.0
  flutter_secure_storage: ^10.3.1 # JWT pair + cached profile (ApiClient)
  google_sign_in: ^7.2.0        # v7 flow: instance → initialize → authenticate
  play_install_referrer: ^0.5.0 # referral attribution (Play Install Referrer)
  posthog_flutter: ^5.28.0      # product analytics — manual events only,
                                # autocapture/replay OFF (behind AnalyticsService)
  facebook_app_events: ^0.30.1  # Meta ★ conversion events only; OFF until
                                # META_APP_ID + META_CLIENT_TOKEN are real
  phonepe_payment_sdk: ^3.0.2   # premium — vendored override below (AGP fix)
  file_picker: ^12.0.0-beta.7   # upload-your-content (FileType.media pick)

  # ── Firebase — Crashlytics + Performance + Analytics (GA4). SEPARATE from
  # PostHog (our primary product analytics). All run in EVERY real build (debug,
  # profile, release) and are skipped ONLY under `flutter test` — gated by
  # AppConfig.firebaseEnabled in main.dart + the crash/perf providers +
  # GoogleAnalyticsService selection, where Firebase has no platform channel.
  # Wrapped behind CrashReporter / PerformanceMonitor / AnalyticsService — never
  # call the Firebase SDKs from widgets. Analytics (firebase_analytics) is
  # GA4-for-apps: it feeds the Firebase/GA4 console AND is the required conversion
  # source for Google Ads (link the Firebase project ↔ Google Ads account in the
  # console — no code). It receives ALL events (parity with PostHog); the ★ events
  # additionally map to GA4 standard events (login/purchase) so they're Google
  # Ads-eligible.
  #
  # CONDITIONALLY GATED (Arul delta from the reference, which is always-on because
  # its google-services.json always exists). LIVE since 2026-07-18:
  # android/app/google-services.json is in place and both env files set
  # FIREBASE_ENABLED=true, so every real build gets the real SDKs. The gate stays
  # so `flutter test` and define-less builds remain inert — the gradle plugins
  # apply only when the file is present (app/build.gradle.kts), and firebaseEnabled
  # false makes main.dart + the providers select the no-op impls. NOTE:
  # google-services.json is git-ignored, so a fresh clone must supply its own
  # before FIREBASE_ENABLED=true will work.
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_performance: ^0.11.4+3
  firebase_analytics: ^12.4.3
  # Agent UI automation only — enableFlutterDriverExtension() in main.dart,
  # opt-in per run via --dart-define=ENABLE_FLUTTER_DRIVER=true (a const gate:
  # compiled out of every other build, release binaries tree-shake it away).
  # Regular dep, not dev, because main.dart imports it.
  flutter_driver:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Layer 2 of the l10n overflow audit ONLY (integration_test/). It runs the
  # same registry as test/l10n/ on a real Android device, where the fonts and
  # the platform font resolution are the device's own rather than the harness's
  # — the two layers must agree, and a disagreement is a harness fidelity bug.
  # Test-only: nothing under lib/ imports it, so it never ships.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  build_runner: ^2.15.0
  riverpod_generator: ^4.0.4
  freezed: ^3.2.5
  json_serializable: ^6.14.0

# phonepe_payment_sdk 3.0.2 ships a Gradle file that calls
# getDefaultProguardFile('proguard-android.txt'), removed in AGP 9 — vendored in
# third_party/ with the one-line fix (see the reference app's pubspec note).
dependency_overrides:
  phonepe_payment_sdk:
    path: third_party/phonepe_payment_sdk

flutter:
  generate: true          # gen_l10n
  uses-material-design: true
  assets:
    - assets/images/
    # ONE onboarding shutter frame for every language — the cuts are the same
    # footage with re-voiced audio (~41 dB PSNR apart at frame 0), so five
    # copies would have been 38 KB of the same picture. 512x288 LOSSY WebP,
    # 9.6 KB: lossy, not lossless like the deity art, because this is a
    # photograph and lossless comes out ~11x bigger for no visible gain.
    # Bundled because the trial screen must paint the card instantly; the MP4
    # itself is NOT bundled (Play cannot language-split flutter_assets, so all
    # six cuts would ship to every install and one would ever play).
    - assets/images/onboarding/
    - assets/premium/
    # Ringtone row art: one transparent gold figure per deity, composited over
    # the hashed jewel-tone ground the app still draws. Bundled, not streamed —
    # 17 files / ~1.0 MB total (lossless WebP — pixel-identical to the PNG
    # masters, ~35% smaller), and the list would otherwise fire 130+ tiny
    # image requests on a tab that must feel instant. Authored at 1254² and
    # stored at 384²: the figures are fine line art, so they need well above the
    # ~200px they paint at, but 1254² would put 7 MB in the AAB for nothing. Adding a deity means an
    # app release; a deity with no asset falls back to its category's image,
    # so a catalog-only addition degrades instead of breaking (deity_art.dart).
    - assets/ringtones/
    # The splash / sign-in background clip. Bundled, not streamed: the first
    # screen must never wait on the network, and it is the same lotus clip the
    # entire brand palette was extracted from — 4.3 MB, 1024x1824 (w%128==0,
    # h%32==0, per the decoder constraint in docs/media-conventions.md).
    # Full-quality source swapped in 2026-07-14; the old 640x1152/1.1Mbps
    # encode read visibly soft full-bleed on 1080-wide screens.
    - assets/video/
  fonts:
    # Display serif — ONLY the Latin "Arul" wordmark, screen titles, and the
    # display numerals/headings the design README names. All other UI text
    # stays on the system stack (covers all 5 Indic scripts at zero bytes).
    - family: Marcellus
      fonts:
        - asset: assets/fonts/Marcellus-Regular.ttf

    # ── Premium paywall only (design_handoff_arul_premium). BUNDLED, never
    # fetched — google_fonts stays out for the reasons at the top of this file.
    # All six cuts are instanced from the upstream VARIABLE fonts and subset to
    # Latin + punctuation + the currency block by tools/build-fonts.py; that
    # script is the record of how to regenerate them. Licenses: assets/fonts/
    # OFL-*.txt. The paywall is English-by-decision (CLAUDE.md §5 / the handoff),
    # so a Latin-only subset can never meet a script it does not cover.
    - family: Cinzel
      fonts:
        - asset: assets/fonts/Cinzel-Medium.ttf
          weight: 500
    - family: Lora
      fonts:
        - asset: assets/fonts/Lora-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lora-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lora-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lora-SemiBold.ttf
          weight: 600
    # The price numerals. The handoff asks for Georgia, which Android does not
    # ship; Gelasio is Georgia's metric-compatible open twin and keeps the
    # old-style figures the design renders with (1/2 at x-height, 3/5/7/9
    # descending). It is also the ONLY serif here that carries U+20B9 ₹ —
    # Cinzel, Lora and Marcellus all lack it — so it doubles as the fallback
    # that keeps a rupee sign inside Lora body copy from landing in Roboto.
    - family: Gelasio
      fonts:
        - asset: assets/fonts/Gelasio-Regular.ttf
          weight: 400

# Regenerating (`flutter_native_splash:create`) REWRITES values/colors.xml and
# values/styles.xml, so these values must stay equal to what is checked in there
# or a regen silently reverts the splash.
#
# STRONGER WARNING SINCE 2026-08-29: values/styles.xml is now HAND-OWNED. LaunchTheme
# parents `Theme.SplashScreen.IconBackground` and sets `postSplashScreenTheme` +
# `windowSplashScreenAnimatedIcon` for androidx.core:core-splashscreen, which backports
# the Android 12 splash to API 23+. This generator does NOT emit any of that, so a regen
# drops the backport and silently returns API<=30 to a bare flat-colour launch surface
# (~28% of installs; measured on a vivo 1916 / Android 9). If you must regen, re-apply
# the LaunchTheme block in BOTH values/ and values-night/ styles.xml afterwards.
flutter_native_splash:
  color: "#14090C"        # == ArulTokens.darkSurface == values/colors.xml splash_bg. If these three
                          # ever disagree, the OS splash flashes a different black than
                          # the app paints, and the handoff visibly pops.
                          # Pre-Android-12 only — there is no OS icon treatment there.
  color_dark: "#14090C"
  # Android 12+ draws the adaptive launcher icon on this field, crimson disc and
  # all. == values/colors.xml splash_icon_field: the icon background layer's
  # colour at the circle-mask edge, so the disc dissolves into the field instead
  # of floating on brand ink. Deliberately NOT #14090C.
  android_12:
    color: "#911B35"
    icon_background_color: "#911B35"
