# Balanced memory limits for Flutter/Android development on a 16 GB machine.
# Gradle and Kotlin use separate JVMs, so cap both to leave memory for the IDE,
# Dart/Flutter tooling, the browser, Windows, and an Android device/emulator.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xms128m -Xmx1G -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=3
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
