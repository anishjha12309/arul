# Gradle and Kotlin run in SEPARATE JVMs -> their heaps add up on a 16 GB machine -> cap both, not just Gradle.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xms128m -Xmx1G -XX:MaxMetaspaceSize=384m
org.gradle.workers.max=3
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
# Both flags come from the Flutter template -> removing one silently takes AGP's default -> leave them declared.
android.newDsl=false
android.builtInKotlin=false
