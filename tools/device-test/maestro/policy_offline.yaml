appId: com.hsrutility.arul
name: policy_offline
# Offline is a whole-app contract, and it has two faces the rig can reach:
#   the FEED gates shut behind a Retry rather than showing stale wallpapers, and
#   the POLICY reader — a REMOTE document in a fenced WebView — shows the app's own error + Retry.
# `onPageFinished` fires for Android's robot page too, so the reveal must not clear the failure
# (edge-cases.md §App-wide). A policy screen that renders the robot page is the regression.
#
# setAirplaneMode drives `cmd connectivity airplane-mode` and needs no root on Android 12+. The
# wrapper turns airplane mode OFF again on exit whatever happens here, so a failed run never
# leaves the phone dark.
---
- runFlow: _feed.yaml
- setAirplaneMode: enabled
# Offline wins over every catalog state, including a warm cache.
- extendedWaitUntil:
    visible:
      id: "arul_feed_retry"
    timeout: 60000

- tapOn:
    id: "arul_tab_settings"
- scrollUntilVisible:
    element:
      id: "arul_policy_privacy"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "arul_policy_privacy"
# The app's own error state, not Chrome's and not the robot page.
- extendedWaitUntil:
    visible:
      id: "arul_policy_retry"
    timeout: 60000

- setAirplaneMode: disabled
# Radios take a few seconds to come back; the Retry is what re-checks, so give it room.
- waitForAnimationToEnd:
    timeout: 20000
- tapOn:
    id: "arul_policy_retry"
- extendedWaitUntil:
    notVisible:
      id: "arul_policy_retry"
    timeout: 90000
- back

# And the feed recovers the moment the network is back — Retry re-checks connectivity AND reloads.
- tapOn:
    id: "arul_tab_wallpapers"
- runFlow:
    when:
      visible:
        id: "arul_feed_retry"
    commands:
      - tapOn:
          id: "arul_feed_retry"
- extendedWaitUntil:
    visible:
      id: "arul_feed_apply"
    timeout: 90000
