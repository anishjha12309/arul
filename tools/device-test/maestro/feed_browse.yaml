appId: com.hsrutility.arul
name: feed_browse
# Eight cards of vertical browse, then a category round-trip.
# Pairs with the wrapper's wlan0 rx-bytes delta -> bytes per card. The prefetch look-ahead
# is the thing that regresses here (video-feed.md): a browse must cost the cards REACHED.
---
- runFlow: _feed.yaml
- repeat:
    times: 8
    commands:
      # Slow enough that the pager snaps rather than flings past several cards.
      - swipe:
          direction: UP
          duration: 500
      # Controls travel WITH their card, so a missing pill means the card never settled.
      - assertVisible:
          id: "arul_feed_apply"
# Chips are a filter, not a tab: the reel survives a category swap and All comes back.
- tapOn:
    id: "arul_chip_all"
- assertVisible:
    id: "arul_feed_apply"
