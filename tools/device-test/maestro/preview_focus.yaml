appId: com.hsrutility.arul
name: preview_focus
# Preview is FREE — it runs on both accounts and gates nothing (ringtones.md).
#
# THIS FLOW DELIBERATELY ENDS WITH AUDIO PLAYING. The contract under test is the audio FOCUS type
# (GAIN_TRANSIENT, never the permanent music gain that would kill the user's own playback), and the
# only way to read it is `dumpsys audio` while the focus is actually held. So the wrapper samples
# the focus stack between this flow and `preview_stop.yaml`, which is what puts the player back to
# idle and abandons focus. Never run this one on its own and walk away.
---
- runFlow: _feed.yaml
- tapOn:
    id: "arul_tab_ringtones"
- extendedWaitUntil:
    visible:
      id: "arul_ringtone_preview"
    timeout: 60000
- tapOn:
    id: "arul_ringtone_preview"
    index: 0
# ONE shared player; every now-playing affordance derives from ONE currentId, and the toggle flag
# is the affordance the semantics tree exposes.
- extendedWaitUntil:
    visible:
      id: "arul_ringtone_preview"
      checked: true
    timeout: 45000
