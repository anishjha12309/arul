appId: com.hsrutility.arul
name: apply_live
# PREMIUM ACCOUNT. Live apply ALWAYS opens the system live-wallpaper chooser — there is no
# in-place swap, and the notifier finishes IDLE and never claims success (wallpaper-apply.md).
# So the flow can only prove that the chooser opened and that the app survived the round trip;
# whether the live SERVICE actually landed is the wrapper's `dumpsys wallpaper` check.
#
# The chooser's confirm button is OEM text — it is a parameter, not a constant. Its default is
# AOSP's. If the chooser text differs on the phone under test, pass a new value rather than
# editing this file.
env:
  LIVE_CHOOSER_CONFIRM: "Set wallpaper"
---
- runFlow: _feed.yaml
# Walk to a live card. 12 is a ceiling, not a target: the feed interleaves static and live, so a
# live card is normally two or three swipes away, and a run that reaches the ceiling has found a
# catalog with no live rows in the served list — which is itself the failure worth seeing.
- repeat:
    times: 12
    commands:
      - runFlow:
          when:
            notVisible:
              id: "arul_live_mark"
          commands:
            - swipe:
                direction: UP
                duration: 500
            - waitForAnimationToEnd:
                timeout: 5000
- assertVisible:
    id: "arul_live_mark"
- tapOn:
    id: "arul_feed_apply"
# The MP4 downloads first and the feed decoder is released only after that, so the chooser can be
# tens of seconds out on a cold cache.
- extendedWaitUntil:
    notVisible:
      id: "arul_feed_apply"
    timeout: 180000
- tapOn:
    text: "${LIVE_CHOOSER_CONFIRM}"
    optional: true
- waitForAnimationToEnd:
    timeout: 20000
# Whatever the chooser did, the app comes back to its own feed rather than dying or restarting.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible:
      id: "arul_feed_apply"
    timeout: 90000
