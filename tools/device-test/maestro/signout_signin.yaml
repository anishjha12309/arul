appId: com.hsrutility.arul
name: signout_signin
# Settings -> sign out -> the wall -> pill -> Google account picker -> feed.
#
# THE GOOGLE SURFACE IS NOT OURS. Everything from the pill tap to the feed is Credential Manager
# UI drawn by Google Play services (com.google.android.gms) inside THIS app's task. Maestro drives
# it because it is an OS-level driver, not an in-process one — but nothing in it carries an id we
# own, so it is matched by the ACCOUNT EMAIL text, passed in as ${ACCOUNT_EMAIL}. The account must
# already be on the device: this rig never adds one, and "Add another account" is a hard fail.
#
# The wall auto-launches a Google surface on its first frame (auth.md). A DISMISSED sheet stops the
# attempt — no picker, no auto-relaunch — which is exactly the state the pill tap then needs, so the
# back below is a precondition, not a workaround.
env:
  ACCOUNT_EMAIL: "unset@example.com"
---
- runFlow: _feed.yaml
- tapOn:
    id: "arul_tab_settings"
- scrollUntilVisible:
    element:
      id: "arul_settings_logout"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "arul_settings_logout"
- assertVisible:
    id: "arul_confirm_ok"
- tapOn:
    id: "arul_confirm_ok"
# We left Settings; what is on top now is either the wall or the auto-launched Google surface.
- extendedWaitUntil:
    notVisible:
      id: "arul_settings_logout"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 15000
# Dismiss the auto-launched sheet/picker if one drew. Guarded: a back on the bare wall would exit.
- runFlow:
    when:
      notVisible:
        id: "arul_signin_pill"
    commands:
      - back
      - waitForAnimationToEnd:
          timeout: 10000
- extendedWaitUntil:
    visible:
      id: "arul_signin_pill"
    timeout: 30000
# ONE line under the pill for every failure, and nothing else (auth.md, edge-cases.md §Auth).
# The subtitle node carries its own text; there is no help link and no fix line to assert against.
- assertVisible:
    id: "arul_signin_subtitle"
- assertVisible:
    id: "arul_signin_language"
# A pill tap SKIPS the sheet and opens the picker.
- tapOn:
    id: "arul_signin_pill"
- extendedWaitUntil:
    visible: "${ACCOUNT_EMAIL}"
    timeout: 45000
- tapOn: "${ACCOUNT_EMAIL}"
# Some GMS builds interpose a confirm step; skip it silently when it is not there.
- tapOn:
    text: "Continue|CONTINUE|Agree|I agree"
    optional: true
# Token mint + POST /auth/login + the first catalog read all sit inside this wait.
- extendedWaitUntil:
    visible:
      id: "arul_tab_wallpapers"
    timeout: 90000
- assertNotVisible:
    id: "arul_signin_pill"
