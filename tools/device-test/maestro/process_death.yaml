appId: com.hsrutility.arul
name: process_death
# What survives losing the process, and what the icon launch must clean up.
#
# Google's surfaces live INSIDE this app's task and OUTLIVE its process: swipe home out of a
# picker, lose the process, tap the icon, and Android resumes a dead picker with no app behind it.
# `clearTaskOnLaunch` on MainActivity strips it (auth.md). That is why the relaunch below goes
# through the LAUNCHER intent path — `launchApp` with stopApp:false is the icon, not `am start -n`,
# which bypasses clearTaskOnLaunch and hides exactly this defect.
#
# What this flow does NOT prove: a real low-memory kill. `stopApp` is a force-stop, which is
# cleaner than an LMK kill (no saved instance state, no restored back stack). The owner reproduces
# the real thing with a memory-pressure app; this is the cheap half that regresses more often.
---
- runFlow: _feed.yaml
- tapOn:
    id: "arul_tab_ringtones"
- extendedWaitUntil:
    visible:
      id: "arul_ringtone_set"
    timeout: 60000
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 10000
- stopApp
- launchApp:
    stopApp: false
# Signed in, on the feed, no wall, no stale Google surface over it.
- extendedWaitUntil:
    visible:
      id: "arul_tab_wallpapers"
    timeout: 60000
- assertNotVisible:
    id: "arul_signin_pill"
- extendedWaitUntil:
    visible:
      id: "arul_feed_apply"
    timeout: 60000
