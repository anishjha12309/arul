appId: com.hsrutility.arul
name: paywall_free
# FREE ACCOUNT ONLY. All content is premium (CLAUDE.md §5): apply, share and ringtone-set each
# route STRAIGHT to /premium — no nudge, no sheet, no interstitial (edge-cases.md §Premium).
#
# NOTHING HERE MAY TAP THE BUY BUTTON. A tap starts a real PhonePe mandate against a real UPI app
# on the owner's phone. `arul_paywall_cta` is asserted VISIBLE and never tapped, anywhere, ever.
---
- runFlow: _feed.yaml

# --- Apply -> paywall
- tapOn:
    id: "arul_feed_apply"
- extendedWaitUntil:
    visible:
      id: "arul_paywall_cta"
    timeout: 30000
# PhonePe leads the channel's allowlist and is therefore both the default and the first row
# (UpiIntentChannel.kt). This is the only place "PhonePe" appears on the paywall, so the plain
# text assertion IS the selected-app assertion.
- assertVisible: "PhonePe"
- assertVisible:
    id: "arul_paywall_upi_chip"
# The picker only opens with two or more mandate-capable apps installed — a single app is a fact,
# not a choice, and the chip has no tap target. Both halves are legitimate, so the rows are checked
# only when they actually drew.
- tapOn:
    id: "arul_paywall_upi_chip"
- runFlow:
    when:
      visible:
        id: "arul_upi_option_0"
    commands:
      # Row 0 is the head of the preference order AND the selected one -> PhonePe is first.
      - assertVisible:
          id: "arul_upi_option_0"
          selected: true
      - back
- back
- extendedWaitUntil:
    visible:
      id: "arul_feed_apply"
    timeout: 30000

# --- Share -> paywall
- tapOn:
    id: "arul_feed_share"
- extendedWaitUntil:
    visible:
      id: "arul_paywall_cta"
    timeout: 30000
- assertVisible: "PhonePe"
- back
- extendedWaitUntil:
    visible:
      id: "arul_feed_share"
    timeout: 30000

# --- Ringtone Set -> paywall (preview stays FREE; only Set gates — ringtones.md)
- tapOn:
    id: "arul_tab_ringtones"
- extendedWaitUntil:
    visible:
      id: "arul_ringtone_set"
    timeout: 60000
- tapOn:
    id: "arul_ringtone_set"
    index: 0
- extendedWaitUntil:
    visible:
      id: "arul_paywall_cta"
    timeout: 30000
- assertVisible: "PhonePe"
- back
- extendedWaitUntil:
    visible:
      id: "arul_ringtone_set"
    timeout: 30000
- tapOn:
    id: "arul_tab_wallpapers"
