appId: com.hsrutility.arul
name: _feed
# Subflow: cold-start the app and land on the Wallpapers feed, signed in.
# Every flow that needs a known starting point calls this instead of repeating it.
# stopApp: true so each flow starts from a cold process — the same shape the owner walks by hand.
---
- launchApp:
    stopApp: true
# The catalog is a network read on a cold cache; 60 s covers a slow first fetch on a 3G-ish link.
- extendedWaitUntil:
    visible:
      id: "arul_tab_wallpapers"
    timeout: 60000
- assertNotVisible:
    id: "arul_signin_pill"
- extendedWaitUntil:
    visible:
      id: "arul_feed_apply"
    timeout: 60000
